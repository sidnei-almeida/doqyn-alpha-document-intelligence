groups:
  - name: doqyn-production
    rules:
      - alert: DoqynPreviewQueueBacklog
        expr: doqyn_preview_queue_waiting > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fila de preview acumulando
          description: Mais de 30 previews aguardando — verifique doqyn-worker-preview.

      - alert: DoqynAnalysisQueueBacklog
        expr: doqyn_analysis_queue_waiting > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fila de análise acumulando
          description: Mais de 50 jobs aguardando há 10 minutos — considere escalar workers.

      - alert: DoqynAnalysisQueueStalled
        expr: doqyn_analysis_queue_active == 0 and doqyn_analysis_queue_waiting > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Fila com jobs pendentes mas nenhum worker ativo
          description: Verifique logs do container doqyn-worker.

      - alert: DoqynApiHighErrorRate
        expr: |
          (
            sum(rate(doqyn_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(doqyn_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Taxa de erro 5xx acima de 5%
          description: Investigue logs da API e dependências (Mongo, Redis, auth).

      - alert: DoqynSessionCacheLowHitRate
        expr: |
          (
            sum(rate(doqyn_session_verify_total{result="cache_hit"}[10m]))
            /
            clamp_min(sum(rate(doqyn_session_verify_total[10m])), 0.001)
          ) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Cache de sessão com hit rate baixo
          description: Verifique Redis e SESSION_CACHE_ENABLED.

      - alert: DoqynAiProviderErrors
        expr: |
          sum(rate(doqyn_ai_provider_requests_total{status="error"}[15m]))
          /
          clamp_min(sum(rate(doqyn_ai_provider_requests_total[15m])), 0.001)
          > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Alta taxa de erro no provedor de IA
          description: Verifique GROQ_API_KEY, quotas e rate limits.

      - alert: DoqynQuotaExceededSpike
        expr: increase(doqyn_quota_exceeded_total[1h]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Muitas rejeições por quota de tenant
          description: Um ou mais tenants podem estar abusando dos limites.
