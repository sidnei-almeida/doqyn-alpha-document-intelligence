# Stack de produção DOQYN — auth + alpha + Mongo + Nginx
#
# Pré-requisito: clonar os dois repositórios lado a lado:
#   ~/doqyn/doqyn-auth-service
#   ~/doqyn/doqyn-alpha-document-intelligence
#
# Uso (a partir deste repositório):
#   ./deploy/scripts/setup-production-env.sh
#   ./deploy/scripts/deploy-production.sh
#
# Ou manualmente:
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d

name: doqyn

services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doqyn_auth}
      POSTGRES_USER: ${POSTGRES_USER:-doqyn_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em deploy/.env}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-doqyn_auth} -d ${POSTGRES_DB:-doqyn_auth}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  auth-migrate:
    build:
      context: ${AUTH_SERVICE_DIR:-../../doqyn-auth-service}
      dockerfile: docker/Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: "no"
    networks:
      - doqyn

  auth-api:
    build:
      context: ${AUTH_SERVICE_DIR:-../../doqyn-auth-service}
      dockerfile: docker/Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}
      DOQYN_APP_BASE_URL: http://doqyn-api:3001
    depends_on:
      postgres-auth:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - doqyn

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  doqyn-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DOQYN_AUTH_BASE_URL: http://auth-api:4100
    depends_on:
      mongo:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks:
      - doqyn

  doqyn-api-indexes:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    command: ["./node_modules/.bin/tsx", "scripts/ensure-mongodb-indexes.ts"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - doqyn

  doqyn-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-DOQYN}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-doqyn_auth}
        VITE_AUTH_BASE_PATH: ${VITE_AUTH_BASE_PATH:-/auth}
    depends_on:
      doqyn-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doqyn

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      doqyn-web:
        condition: service_healthy
      doqyn-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - doqyn

volumes:
  postgres_auth_data:
  mongo_data:

networks:
  doqyn:
    driver: bridge
