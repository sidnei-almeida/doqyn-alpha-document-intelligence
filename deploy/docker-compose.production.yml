# Stack de produção DOQYN — auth + alpha + Mongo + Nginx
#
# Pré-requisito: clonar os dois repositórios lado a lado:
#   ~/doqyn/doqyn-auth-service
#   ~/doqyn/doqyn-alpha-document-intelligence
#
# Uso (a partir deste repositório):
#   ./deploy/scripts/setup-production-env.sh
#   ./deploy/scripts/deploy-production.sh
#   ./deploy/scripts/up-observability.sh          # opcional
#   ./deploy/scripts/validate-vps-ready.sh        # checagem pré-VPS
#
# Ou manualmente:
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d

name: doqyn

services:
  postgres-auth:
    image: postgres:16-alpine
    # Orçamento 8GB/2vCPU — ver docs/PLANO_ACAO_ESCALA_2026-07-20.md (Passo 1)
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    mem_reservation: 512m
    cpus: ${POSTGRES_CPUS:-0.5}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doqyn_auth}
      POSTGRES_USER: ${POSTGRES_USER:-doqyn_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em deploy/.env}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-doqyn_auth} -d ${POSTGRES_DB:-doqyn_auth}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p2
    mem_limit: 64m
    cpus: 0.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  auth-migrate:
    build:
      context: ${AUTH_SERVICE_DIR:-../../doqyn-auth-service}
      dockerfile: docker/Dockerfile
      target: migrate
    # One-shot: roda no deploy, sem concorrer com o regime normal.
    mem_limit: 384m
    cpus: 0.5
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DIRECT:-postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}}
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: "no"
    networks:
      - doqyn

  auth-api:
    # Réplicas: DOQYN_API_REPLICAS / AUTH_API_REPLICAS em deploy/.env (deploy-production.sh)
    build:
      context: ${AUTH_SERVICE_DIR:-../../doqyn-auth-service}
      dockerfile: docker/Dockerfile
      target: runner
    mem_limit: ${AUTH_API_MEM_LIMIT:-512m}
    mem_reservation: 256m
    cpus: ${AUTH_API_CPUS:-0.5}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Abaixo do mem_limit: heap não é toda a memória do processo.
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-doqyn_auth}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-postgresql://${POSTGRES_USER:-doqyn_auth}:${POSTGRES_PASSWORD}@postgres-auth:5432/${POSTGRES_DB:-doqyn_auth}}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_KEY_PREFIX: "doqyn:auth:"
      RATE_LIMIT_REDIS_ENABLED: "true"
      DOQYN_APP_BASE_URL: http://doqyn-api:3001
    depends_on:
      postgres-auth:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - doqyn

  mongo:
    profiles: ["local-mongo"]
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  redis:
    image: redis:7-alpine
    # noeviction é REQUISITO do BullMQ: com allkeys-lru o Redis descarta chaves de job sob
    # pressão e documentos enviados nunca são analisados, sem erro em lugar nenhum.
    # Seguro porque todo cache aqui tem TTL (sessão, quota, slot de análise).
    # AOF no lugar de RDB: --save faz fork, e copy-on-write dobra a memória num pico.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-640mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --loglevel
      - warning
    mem_limit: ${REDIS_MEM_LIMIT:-900m}
    mem_reservation: 320m
    cpus: ${REDIS_CPUS:-0.3}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - doqyn

  doqyn-api:
    # Réplicas: manter DOQYN_API_REPLICAS=1 em 2 vCPU — réplicas competem pelos mesmos
    # 2 núcleos que os 3 processos Node já disputam. Ver Passo 8 do plano de escala.
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    mem_limit: ${DOQYN_API_MEM_LIMIT:-1g}
    mem_reservation: 512m
    cpus: ${DOQYN_API_CPUS:-0.8}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      API_PORT: 3001
      DOQYN_AUTH_BASE_URL: http://auth-api:4100
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_KEY_PREFIX: "doqyn:alpha:"
      ANALYSIS_SYNC_FALLBACK: "false"
      PREVIEW_SYNC_FALLBACK: "false"
      # Mesmo teto do worker: o contador é da conta Groq e vive no Redis, então todo processo que
      # possa chamar a Groq precisa enxergar o mesmo limite.
      GROQ_MAX_REQUESTS_PER_MINUTE: ${GROQ_MAX_REQUESTS_PER_MINUTE:-25}
      GROQ_MAX_TOKENS_PER_MINUTE: ${GROQ_MAX_TOKENS_PER_MINUTE:-20000}
      METRICS_ENABLED: "true"
      METRICS_SERVICE_NAME: doqyn-api
      METRICS_SERVICE_ROLE: api
    volumes:
      # Vision OCR: deploy/secrets/gcp-vision-sa.json → /run/secrets/gcp-vision-sa.json
      - ./secrets:/run/secrets:ro
    # Sem depends_on em `mongo`: o serviço é profile-gated (local-mongo) e com Atlas
    # (MONGODB_USE_ATLAS=true) referenciá-lo invalida o projeto inteiro. A prontidão do
    # Mongo é coberta pelo healthcheck profundo abaixo e pela ordem em deploy-production.sh.
    depends_on:
      redis:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health/deep"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks:
      - doqyn

  doqyn-api-indexes:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    # One-shot: cria índices no Atlas. Heap limitado — sem isso o V8 dimensiona pelos 8GB da VM.
    mem_limit: 512m
    cpus: 0.5
    env_file:
      - .env
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    command: ["node", "dist/scripts/ensure-mongodb-indexes.js"]
    # Sem depends_on em `mongo` (profile-gated) — roda via `compose run --rm` depois do Mongo.
    restart: "no"
    networks:
      - doqyn

  doqyn-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    # Com EMBEDDING_ENABLED=true o ONNX soma ~300 MB fora do heap do V8; suba
    # DOQYN_WORKER_MEM_LIMIT para 1.5g antes de ligar a vetorização.
    mem_limit: ${DOQYN_WORKER_MEM_LIMIT:-1g}
    mem_reservation: 512m
    cpus: ${DOQYN_WORKER_CPUS:-0.8}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      DOQYN_AUTH_BASE_URL: http://auth-api:4100
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_KEY_PREFIX: "doqyn:alpha:"
      ANALYSIS_SYNC_FALLBACK: "false"
      PREVIEW_SYNC_FALLBACK: "false"
      # Análise é espera de rede, não CPU: dos ~2,2s de um documento, ~2,1s são a Groq respondendo
      # (medido em docs/AUDITORIA-ESCALA-ENVIO-2026-08-15.md). O teto de 2 tratava o job como se
      # fosse CPU e limitava a plataforma inteira a ~55 documentos por minuto.
      # Quem protege a conta da Groq agora é o limitador de vazão em groqRateLimiter.ts, não a
      # concorrência da fila — subir este número sem GROQ_MAX_* configurado troca fila por 429.
      ANALYSIS_QUEUE_CONCURRENCY_GLOBAL: ${ANALYSIS_QUEUE_CONCURRENCY_GLOBAL:-8}
      ANALYSIS_QUEUE_CONCURRENCY_PER_TENANT: ${ANALYSIS_QUEUE_CONCURRENCY_PER_TENANT:-2}
      # Teto da conta Groq, compartilhado por todos os workers. Ajuste ao plano contratado.
      GROQ_MAX_REQUESTS_PER_MINUTE: ${GROQ_MAX_REQUESTS_PER_MINUTE:-25}
      GROQ_MAX_TOKENS_PER_MINUTE: ${GROQ_MAX_TOKENS_PER_MINUTE:-20000}
      # Vetorização do RAG. Desligada por padrão: chunk novo nasce sem vetor e só entra na busca
      # semântica pelo backfill. O worker de análise é quem consome a fila.
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_CACHE_DIR: /app/.cache/transformers
      EMBEDDING_QUEUE_CONCURRENCY: ${EMBEDDING_QUEUE_CONCURRENCY:-1}
      # Fatiamento do PDF, que saiu do request de confirmação. É CPU e divide o processo com a
      # análise: subir daqui troca latência de análise por vazão de fatiamento.
      CHUNKING_QUEUE_CONCURRENCY: ${CHUNKING_QUEUE_CONCURRENCY:-1}
      METRICS_ENABLED: "true"
      METRICS_SERVICE_NAME: doqyn-worker
      METRICS_SERVICE_ROLE: worker
      METRICS_PORT: 9100
    volumes:
      - ./secrets:/run/secrets:ro
      # Sem volume, o ONNX (~280 MB) é rebaixado a cada restart de container.
      - embedding_cache:/app/.cache/transformers
    depends_on:
      redis:
        condition: service_healthy
      doqyn-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/server/workers/runAnalysisWorker.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - doqyn

  doqyn-worker-preview:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - .env
    command: ["node", "dist/server/workers/runPreviewWorker.js"]
    mem_limit: ${DOQYN_WORKER_PREVIEW_MEM_LIMIT:-768m}
    mem_reservation: 384m
    cpus: ${DOQYN_WORKER_PREVIEW_CPUS:-0.6}
    environment:
      NODE_ENV: production
      # Heap menor: o custo do Ghostscript é processo filho, fora do heap do Node.
      NODE_OPTIONS: --max-old-space-size=512
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_KEY_PREFIX: "doqyn:alpha:"
      PREVIEW_SYNC_FALLBACK: "false"
      # Cada job gera um Ghostscript CPU-bound. Default do código é 4 — em 2 vCPU, trava a máquina.
      PREVIEW_QUEUE_CONCURRENCY_GLOBAL: ${PREVIEW_QUEUE_CONCURRENCY_GLOBAL:-1}
      METRICS_ENABLED: "true"
      METRICS_SERVICE_NAME: doqyn-worker-preview
      METRICS_SERVICE_ROLE: worker-preview
      METRICS_PORT: 9100
    depends_on:
      redis:
        condition: service_healthy
      doqyn-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/server/workers/runPreviewWorker.js >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - doqyn

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-DOQYN}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-doqyn_auth}
        VITE_AUTH_BASE_PATH: ${VITE_AUTH_BASE_PATH:-/auth}
        VITE_PRESIGNED_UPLOAD_ENABLED: ${VITE_PRESIGNED_UPLOAD_ENABLED:-false}
    mem_limit: 128m
    cpus: 0.2
    depends_on:
      doqyn-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - doqyn

  # --- Observabilidade (profile opcional: --profile observability) ---
  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doqyn

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - ./secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      doqyn-api:
        condition: service_healthy
      doqyn-worker:
        condition: service_started
      doqyn-worker-preview:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped
    networks:
      - doqyn

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD em deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - doqyn

volumes:
  embedding_cache:
  postgres_auth_data:
  mongo_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  doqyn:
    driver: bridge
