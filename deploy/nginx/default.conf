upstream doqyn_api {
  server doqyn-api:3001;
  keepalive 16;
}

upstream doqyn_auth {
  server auth-api:4100;
  keepalive 8;
}

map $http_user_agent $is_social_bot {
  default 0;
  ~*(facebookexternalhit|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|googlebot|bingbot|applebot|embedly) 1;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 30m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_pass http://doqyn_api;
  }

  location /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://doqyn_auth/auth/;
  }

  location /oauth/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://doqyn_auth/oauth/;
  }

  location = /health {
    proxy_pass http://doqyn_auth/health;
  }

  location ~ ^/guest/share/(?<token>[^/]+)$ {
    if ($is_social_bot) {
      rewrite ^ /api/og/guest/share/$token last;
    }
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/guest/sign/(?<token>[^/]+)$ {
    if ($is_social_bot) {
      rewrite ^ /api/og/guest/sign/$token last;
    }
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/share/(?<token>[^/]+)$ {
    if ($is_social_bot) {
      rewrite ^ /api/og/guest/share/$token last;
    }
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/sign/(?<token>[^/]+)$ {
    if ($is_social_bot) {
      rewrite ^ /api/og/guest/sign/$token last;
    }
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
