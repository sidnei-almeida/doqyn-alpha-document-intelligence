<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- O SVG vem primeiro: é o único que acompanha o tema do navegador. Os PNG
         ficam de reserva para quem não o aceita, num teal que serve aos dois. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!--
      Largura fixa de desktop, de propósito.

      Este é um produto de mesa: governança documental, matriz de acesso, auditoria — trabalho de
      jurídico e compliance, feito no computador. A casca do workspace nunca teve tratamento
      responsivo (a sidebar não tem um único breakpoint), e com `width=device-width` o navegador
      do celular tentava um layout mobile que não existe: a barra lateral ocupava a tela e o
      conteúdo saía por fora.

      Declarar 1280 faz o celular renderizar o mesmo layout do computador, com pinça para ampliar
      — que é como o app já se comportava quando alguém ligava "modo desktop" à mão, e funcionava.
      Feio de ler em tela pequena, mas inteiro e utilizável, em vez de quebrado.

      É escolha interina e consciente. O caminho de verdade para o celular será uma API própria
      via WhatsApp, não esta tela espremida — por isso não vale investir num layout mobile que
      quase ninguém abriria. Quando o portal do convidado (link de assinatura, que chega a quem
      não é usuário) merecer tratamento próprio, ele pede viewport por rota.
    -->
    <meta name="viewport" content="width=1280" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0E10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F7F8" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="DOQYN — Gestão segura, inteligente e rastreável de documentos empresariais"
    />
    <!--
      Cartão de link na própria casca do app.

      A página do robô (server/og/) só é servida quando o user-agent se identifica como um —
      e o WhatsApp Web busca a prévia pelo navegador do usuário, com user-agent de Chrome.
      Nesse caminho ele recebia esta casca, que não dizia nada, e a mensagem saía mostrando só
      o domínio. Como o cartão deixou de falar do documento, ele cabe aqui: vale para qualquer
      rota, sem detecção de nada.

      URL absoluta porque prévia de link exige — crawler nenhum resolve caminho relativo de
      forma confiável. É o endereço público de produção, o único que serve este app.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOQYN" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="DOQYN · Document Intelligence" />
    <meta
      property="og:description"
      content="Gestão segura, inteligente e rastreável de documentos empresariais."
    />
    <meta property="og:image" content="https://app.doqyn.com/og/portal-card.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOQYN · Document Intelligence" />
    <meta
      name="twitter:description"
      content="Gestão segura, inteligente e rastreável de documentos empresariais."
    />
    <meta name="twitter:image" content="https://app.doqyn.com/og/portal-card.png?v=2" />
    <title>DOQYN · Document Intelligence</title>
  </head>
  <body>
    <script>
      // Dois atributos, não um: `data-appearance` nomeia o tema e `data-theme` diz
      // qual paleta vale por padrão — a do painel. No `standard` a casca desmente
      // esse padrão localmente. Espelha `src/lib/theme.ts`; se um mudar, muda os dois.
      (function () {
        var stored = localStorage.getItem('doqyn-theme');
        var theme =
          stored === 'standard' || stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'standard';
        var palette = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.appearance = theme;
        document.documentElement.dataset.theme = palette;
        document.documentElement.style.colorScheme = palette;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
